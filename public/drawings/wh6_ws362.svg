<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" width="100%" height="100%">
  <defs>
    <style>
      .svg-bg { fill: #f8fafc; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
      .rack-boundary { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4, 2; }
      .rack-text { font-size: 13px; font-weight: 700; fill: #64748b; font-family: sans-serif; }
      .aisle-boundary { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .rail-center-line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6, 4; }
      .rail-side-line { stroke: #cbd5e1; stroke-width: 1; }
      .aisle-label { font-size: 11px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.5px; font-family: sans-serif; }
      .crane-unit {
        transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1.0);
        will-change: transform;
      }
      .crane-body { fill: #3b82f6; stroke: #1d4ed8; stroke-width: 2; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15)); }
      .crane-inner { fill: #60a5fa; stroke: #2563eb; stroke-width: 1; }
      .crane-cross { stroke: #ffffff; stroke-width: 1; opacity: 0.7; }
      .crane-center-dot { fill: #ffffff; }
      .crane-label { font-size: 10px; font-weight: 800; fill: #1e3a8a; font-family: sans-serif; }
      .conveyor-lane { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      .conveyor-label { font-size: 10px; font-weight: 700; fill: #475569; font-family: sans-serif; }
      .ws-boundary { fill: #ffffff; stroke: #2e7d32; stroke-width: 2; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.05)); }
      .ws-title { font-size: 13px; font-weight: 700; fill: #2e7d32; letter-spacing: 0.3px; font-family: sans-serif; }
      .tray-rect { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; transition: all 0.2s ease; }
      .tray-inbound { fill: #ecfdf5; stroke: #10b981; }
      .tray-outbound { fill: #eff6ff; stroke: #3b82f6; }
      .tray-active { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4)); }
      .tray-title { font-size: 12px; font-weight: 700; fill: #334155; font-family: sans-serif; pointer-events: none; }
      .tray-sub { font-size: 10px; font-weight: 500; fill: #64748b; font-family: sans-serif; pointer-events: none; }
      .active-title { fill: #92400e; }
      .active-sub { fill: #b45309; }
      .clickable { cursor: pointer; }
      .clickable:hover .tray-rect { filter: brightness(0.92); stroke-width: 2; }
      .clickable:hover.tray-active .tray-rect { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.7)); }
      .operator-icon-bg { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .operator-icon { font-size: 10px; font-weight: 800; fill: #0369a1; font-family: sans-serif; }
      .operator-text { font-size: 10px; font-weight: 600; fill: #0369a1; font-family: sans-serif; }
      .flow-arrow { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 3, 2; fill: none; }
      .legend-crane { fill: #3b82f6; stroke: #1d4ed8; }
      .legend-inbound { fill: #ecfdf5; stroke: #10b981; }
      .legend-active { fill: #fef3c7; stroke: #f59e0b; }
      .legend-outbound { fill: #eff6ff; stroke: #3b82f6; }
      .legend-text { font-size: 10px; font-weight: 500; fill: #64748b; font-family: sans-serif; }
    </style>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" />
    </pattern>
  </defs>

  <!-- 배경 그리드 -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" class="svg-bg" />

  <!-- 랙 보관 구역 (좌측 상단 & 하단) -->
  <g class="rack-group">
    <rect x="20" y="30" width="80" height="180" class="rack-boundary" />
    <text x="60" y="125" class="rack-text" text-anchor="middle">RACK-A</text>

    <rect x="20" y="250" width="80" height="180" class="rack-boundary" />
    <text x="60" y="345" class="rack-text" text-anchor="middle">RACK-B</text>
  </g>

  <!-- 크레인 주행 레일 및 통로 (중앙) -->
  <g class="crane-aisle-group">
    <rect x="130" y="20" width="140" height="420" class="aisle-boundary" />
    <line x1="200" y1="20" x2="200" y2="440" class="rail-center-line" />
    <line x1="140" y1="20" x2="140" y2="440" class="rail-side-line" />
    <line x1="260" y1="20" x2="260" y2="440" class="rail-side-line" />
    <text x="200" y="40" class="aisle-label" text-anchor="middle">
      CRANE AISLE (주행 통로)
    </text>

    <!-- 실시간 크레인 캐리지 블록 (id="crane-unit") -->
    <g id="crane-unit" class="crane-unit" transform="translate(200, 190)">
      <rect x="-35" y="-30" width="70" height="60" rx="4" class="crane-body" />
      <rect x="-25" y="-20" width="50" height="40" rx="2" class="crane-inner" />
      <line x1="0" y1="-30" x2="0" y2="30" class="crane-cross" />
      <line x1="-35" y1="0" x2="35" y2="0" class="crane-cross" />
      <circle cx="0" cy="0" r="6" class="crane-center-dot" />
      <text x="0" y="3" class="crane-label" text-anchor="middle">CR-6</text>
    </g>
  </g>

  <!-- 이송 컨베이어 연결부 (크레인 통로 -> 작업대) -->
  <g class="conveyor-connection">
    <rect x="270" y="125" width="80" height="30" class="conveyor-lane" />
    <text x="310" y="144" class="conveyor-label" text-anchor="middle">IN CV</text>

    <rect x="270" y="305" width="80" height="30" class="conveyor-lane" />
    <text x="310" y="324" class="conveyor-label" text-anchor="middle">OUT CV</text>
  </g>

  <!-- GR362 작업대 영역 (우측 메인 작업 영역) -->
  <g class="workstation-group">
    <rect x="350" y="40" width="370" height="380" rx="8" class="ws-boundary" />
    <text x="535" y="70" class="ws-title" text-anchor="middle">
      GR362 WORKSTATION (작업대)
    </text>

    <!-- 트레이 포지션: 36201 (입고 대기 포지션) -->
    <g id="pos-36201" class="tray-position tray-inbound clickable" transform="translate(370, 115)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36201</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">입고 대기</text>
    </g>

    <!-- 트레이 포지션: 36202 (입고 버퍼) -->
    <g id="pos-36202" class="tray-position clickable" transform="translate(485, 115)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36202</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">입고 처리</text>
    </g>

    <!-- 트레이 포지션: 36203 (중앙 작업대 / 피킹 포지션) -->
    <g id="pos-36203" class="tray-position tray-active clickable" transform="translate(485, 205)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title active-title" text-anchor="middle">36203</text>
      <text x="45" y="42" class="tray-sub active-sub" text-anchor="middle">작업/피킹</text>
    </g>

    <!-- 작업자 작업 영역 (36203 우측) -->
    <g class="operator-area" transform="translate(600, 200)">
      <circle cx="35" cy="25" r="16" class="operator-icon-bg" />
      <text x="35" y="30" class="operator-icon" text-anchor="middle">OP</text>
      <text x="35" y="55" class="operator-text" text-anchor="middle">작업자</text>
    </g>

    <!-- 트레이 포지션: 36204 (출고 대기 포지션) -->
    <g id="pos-36204" class="tray-position tray-outbound clickable" transform="translate(370, 295)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36204</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">출고 대기</text>
    </g>

    <!-- 트레이 포지션: 36205 (출고 버퍼) -->
    <g id="pos-36205" class="tray-position clickable" transform="translate(485, 295)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36205</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">출고 버퍼</text>
    </g>

    <!-- 이송 흐름 방향 지시 화살표 -->
    <path d="M 465 142 L 480 142" class="flow-arrow" />
    <path d="M 530 175 L 530 200" class="flow-arrow" />
    <path d="M 530 265 L 530 290" class="flow-arrow" />
    <path d="M 480 322 L 465 322" class="flow-arrow" />
  </g>

  <!-- 범례 (Legend) -->
  <g class="legend-group" transform="translate(360, 390)">
    <rect x="0" y="0" width="14" height="14" rx="2" class="legend-crane" />
    <text x="20" y="11" class="legend-text">크레인</text>

    <rect x="80" y="0" width="14" height="14" rx="2" class="legend-inbound" />
    <text x="100" y="11" class="legend-text">입고</text>

    <rect x="150" y="0" width="14" height="14" rx="2" class="legend-active" />
    <text x="170" y="11" class="legend-text">작업중</text>

    <rect x="230" y="0" width="14" height="14" rx="2" class="legend-outbound" />
    <text x="250" y="11" class="legend-text">출고</text>
  </g>
</svg>
