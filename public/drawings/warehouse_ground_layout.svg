<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <defs>
    <!-- 지상 크레인 심볼 (메인 테마 초록색) -->
    <g id="ground-crane-symbol">
      <rect x="-20" y="-16" width="40" height="32" rx="4" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
      <rect x="-16" y="-12" width="32" height="24" rx="2" fill="#43A047"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>
  </defs>

  <style>
    /* ✨ 지상 바탕도 지하와 동일한 클린 화이트로 통일 */
    .bg-ground { fill: #FAFAFA; }
    .conveyor-track-gr { fill: none; stroke: #37474F; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .conveyor-center-gr { fill: none; stroke: #ECEFF1; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .turntable-gr { fill: #FFFFFF; stroke: #263238; stroke-width: 3; }
    .warehouse-box-gr { fill: #FFFFFF; stroke: #1B5E20; stroke-width: 2.2; }
    .rack-line-gr { stroke: #2E7D32; stroke-width: 1.5; }
    .rail-guide-gr { stroke: #1B5E20; stroke-width: 1.8; stroke-dasharray: 6,4; }
    .ws-badge-gr { fill: #FFA000; stroke: #D84315; stroke-width: 1.5; rx: 3; }
    .ws-text-gr { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #212121; text-anchor: middle; dominant-baseline: central; }
    .wh-title-gr { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #2E7D32; letter-spacing: 2px; }
    .crane-unit { transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1.0); will-change: transform; }
  </style>

  <rect width="1600" height="1200" class="bg-ground"/>

  <!-- ================= 1. 지상 컨베이어 라인망 ================= -->
  <g id="ground-conveyors">
    <path d="M 120,340 L 520,340 L 520,440 L 760,440 L 760,980 L 1280,980 L 1280,1050" class="conveyor-track-gr"/>
    <path d="M 120,340 L 520,340 L 520,440 L 760,440 L 760,980 L 1280,980 L 1280,1050" class="conveyor-center-gr"/>

    <circle cx="520" cy="340" r="11" class="turntable-gr"/>
    <circle cx="520" cy="440" r="11" class="turntable-gr"/>
    <circle cx="760" cy="440" r="12" class="turntable-gr"/>
    <circle cx="760" cy="980" r="12" class="turntable-gr"/>
    <circle cx="1280" cy="980" r="12" class="turntable-gr"/>
  </g>

  <!-- ================= 2. 지상 확장 창고 랙 구역 ================= -->

  <!-- WH 6 (가로형) -->
  <g id="gr-wh6">
    <rect x="60" y="380" width="480" height="80" class="warehouse-box-gr"/>
    <line x1="60" y1="420" x2="540" y2="420" class="rail-guide-gr"/>
    <line x1="60" y1="380" x2="100" y2="460" class="rack-line-gr"/>
    <line x1="100" y1="380" x2="60" y2="460" class="rack-line-gr"/>
    <line x1="500" y1="380" x2="540" y2="460" class="rack-line-gr"/>
    <line x1="540" y1="380" x2="500" y2="460" class="rack-line-gr"/>
    <text x="300" y="365" class="wh-title-gr">WH 6</text>
  </g>

  <!-- WH 5 (상단 세로형 좌) -->
  <g id="gr-wh5">
    <rect x="840" y="50" width="100" height="420" class="warehouse-box-gr"/>
    <line x1="890" y1="50" x2="890" y2="470" class="rail-guide-gr"/>
    <line x1="840" y1="50" x2="940" y2="90" class="rack-line-gr"/>
    <line x1="940" y1="50" x2="840" y2="90" class="rack-line-gr"/>
    <text x="965" y="260" class="wh-title-gr" transform="rotate(90, 965, 260)">WH 5</text>
  </g>

  <!-- WH 4 (상단 세로형 우) -->
  <g id="gr-wh4">
    <rect x="1340" y="50" width="100" height="420" class="warehouse-box-gr"/>
    <line x1="1390" y1="50" x2="1390" y2="470" class="rail-guide-gr"/>
    <line x1="1340" y1="50" x2="1440" y2="90" class="rack-line-gr"/>
    <line x1="1440" y1="50" x2="1340" y2="90" class="rack-line-gr"/>
    <text x="1465" y="260" class="wh-title-gr" transform="rotate(90, 1465, 260)">WH 4</text>
  </g>

  <!-- WH 3 (중단 세로형) -->
  <g id="gr-wh3">
    <rect x="840" y="520" width="100" height="240" class="warehouse-box-gr"/>
    <line x1="890" y1="520" x2="890" y2="760" class="rail-guide-gr"/>
    <text x="965" y="640" class="wh-title-gr" transform="rotate(90, 965, 640)">WH 3</text>
  </g>

  <!-- WH 2 (하단 세로형 좌) -->
  <g id="gr-wh2">
    <rect x="840" y="800" width="100" height="370" class="warehouse-box-gr"/>
    <line x1="890" y1="800" x2="890" y2="1170" class="rail-guide-gr"/>
    <line x1="840" y1="1130" x2="940" y2="1170" class="rack-line-gr"/>
    <line x1="940" y1="1130" x2="840" y2="1170" class="rack-line-gr"/>
    <text x="965" y="980" class="wh-title-gr" transform="rotate(90, 965, 980)">WH 2</text>
  </g>

  <!-- WH 1 (하단 세로형 우) -->
  <g id="gr-wh1">
    <rect x="1340" y="700" width="100" height="470" class="warehouse-box-gr"/>
    <line x1="1390" y1="700" x2="1390" y2="1170" class="rail-guide-gr"/>
    <line x1="1340" y1="700" x2="1440" y2="740" class="rack-line-gr"/>
    <line x1="1440" y1="700" x2="1340" y2="740" class="rack-line-gr"/>
    <line x1="1340" y1="1130" x2="1440" y2="1170" class="rack-line-gr"/>
    <line x1="1440" y1="1130" x2="1340" y2="1170" class="rack-line-gr"/>
    <text x="1465" y="940" class="wh-title-gr" transform="rotate(90, 1465, 940)">WH 1</text>
  </g>

  <!-- 지상 워크스테이션 뱃지 -->
  <rect x="540" y="300" width="56" height="24" class="ws-badge-gr"/>
  <text x="568" y="312" class="ws-text-gr">GR111</text>
  <rect x="1200" y="940" width="56" height="24" class="ws-badge-gr"/>
  <text x="1228" y="952" class="ws-text-gr">GR131</text>

  <!-- 동적 크레인 엘리먼트 -->
  <g id="crane-unit-wh1" class="crane-unit" transform="translate(1390, 930)">
    <use href="#ground-crane-symbol"/>
  </g>
  <g id="crane-unit-wh2" class="crane-unit" transform="translate(890, 980)">
    <use href="#ground-crane-symbol"/>
  </g>
  <g id="crane-unit-wh3" class="crane-unit" transform="translate(890, 640)">
    <use href="#ground-crane-symbol"/>
  </g>
  <g id="crane-unit-wh4" class="crane-unit" transform="translate(1390, 260)">
    <use href="#ground-crane-symbol"/>
  </g>
  <g id="crane-unit-wh5" class="crane-unit" transform="translate(890, 260)">
    <use href="#ground-crane-symbol"/>
  </g>
  <g id="crane-unit-wh6" class="crane-unit" transform="translate(300, 420)">
    <use href="#ground-crane-symbol"/>
  </g>
</svg>
