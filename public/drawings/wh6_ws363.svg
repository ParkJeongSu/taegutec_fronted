<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" width="100%" height="100%">
  <defs>
    <style>
      .svg-bg { fill: #f8fafc; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
      .rack-boundary { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4, 2; }
      .rack-text { font-size: 13px; font-weight: 600; fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .aisle-boundary { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .rail-center-line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6, 4; }
      .rail-side-line { stroke: #cbd5e1; stroke-width: 1; }
      .aisle-label { font-size: 11px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      
      /* 크레인 */
      .crane-unit {
        transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1.0);
        will-change: transform;
      }
      .crane-body { fill: #3b82f6; stroke: #1d4ed8; stroke-width: 2; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15)); }
      .crane-inner { fill: #60a5fa; stroke: #2563eb; stroke-width: 1; }
      .crane-cross { stroke: #ffffff; stroke-width: 1; opacity: 0.7; }
      .crane-center-dot { fill: #ffffff; }
      .crane-label { font-size: 11px; font-weight: 700; fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; dominant-baseline: central; }
      
      /* 컨베이어 */
      .conveyor-lane { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      .conveyor-label { font-size: 11px; font-weight: 600; fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .ws-boundary { fill: #ffffff; stroke: #2e7d32; stroke-width: 2; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.05)); }
      .ws-title { font-size: 13px; font-weight: 700; fill: #2e7d32; letter-spacing: 0.3px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      
      /* 포지션 노드 */
      .tray-rect { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; transition: all 0.2s ease; }
      .tray-inbound .tray-rect { fill: #f0fdf4; stroke: #16a34a; }
      .tray-outbound .tray-rect { fill: #eff6ff; stroke: #2563eb; }
      .tray-active .tray-rect { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
      
      /* 노드 라벨 텍스트 */
      .tray-title { font-size: 13px; font-weight: 700; fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; }
      .tray-sub { font-size: 11px; font-weight: 500; fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; }
      .active-title { fill: #92400e; }
      .active-sub { fill: #b45309; }
      
      .clickable { cursor: pointer; }
      .clickable:hover .tray-rect { stroke-width: 2; stroke: #1e40af; }
      
      /* 흐름 연결 패스 (상단 레이어로 돋보이게 보정) */
      .flow-arrow { stroke: #64748b; stroke-width: 2; stroke-dasharray: 4, 3; fill: none; }
      
      /* 범례 */
      .legend-crane { fill: #3b82f6; stroke: #1d4ed8; }
      .legend-inbound { fill: #f0fdf4; stroke: #16a34a; }
      .legend-active { fill: #fffbeb; stroke: #d97706; }
      .legend-outbound { fill: #eff6ff; stroke: #2563eb; }
      .legend-text { font-size: 11px; font-weight: 500; fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      
      /* 실시간 트레이 */
      .tray-unit {
        transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1.0);
        will-change: transform;
        cursor: pointer;
      }
      .tray-base {
        fill: #1976D2;
        stroke: #0D47A1;
        stroke-width: 1.5;
        rx: 6; ry: 6;
        filter: drop-shadow(0 2px 5px rgba(0,0,0,0.25));
      }
      .tray-inner { fill: #2196F3; rx: 3; ry: 3; }
      .tray-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
    </style>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" />
    </pattern>
  </defs>

  <!-- 1. 배경 그리드 -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" class="svg-bg" />

  <!-- 2. 랙 보관 구역 (좌측 상단 & 하단) -->
  <g class="rack-group">
    <rect x="20" y="30" width="80" height="180" class="rack-boundary" />
    <text x="60" y="125" class="rack-text" text-anchor="middle">RACK-A</text>

    <rect x="20" y="250" width="80" height="180" class="rack-boundary" />
    <text x="60" y="345" class="rack-text" text-anchor="middle">RACK-B</text>
  </g>

  <!-- 3. 크레인 주행 통로 및 크레인 (중앙) -->
  <g class="crane-aisle-group">
    <rect x="130" y="20" width="140" height="420" class="aisle-boundary" />
    <line x1="200" y1="20" x2="200" y2="440" class="rail-center-line" />
    <line x1="140" y1="20" x2="140" y2="440" class="rail-side-line" />
    <line x1="260" y1="20" x2="260" y2="440" class="rail-side-line" />
    <text x="200" y="40" class="aisle-label" text-anchor="middle">CRANE AISLE (주행 통로)</text>

    <!-- 실시간 크레인 유닛 -->
    <g id="crane-unit" class="crane-unit" transform="translate(200, 190)">
      <rect x="-35" y="-30" width="70" height="60" rx="4" class="crane-body" />
      <rect x="-25" y="-20" width="50" height="40" rx="2" class="crane-inner" />
      <line x1="0" y1="-30" x2="0" y2="30" class="crane-cross" />
      <line x1="-35" y1="0" x2="35" y2="0" class="crane-cross" />
      <circle cx="0" cy="0" r="6" class="crane-center-dot" />
      <text x="0" y="0" class="crane-label" text-anchor="middle">CR-6</text>
    </g>
  </g>

  <!-- 4. IN CV / OUT CV 바닥 레인 베이스 -->
  <g class="conveyor-connection-in">
    <rect x="270" y="65" width="100" height="48" class="conveyor-lane" />
    <text x="320" y="94" class="conveyor-label" text-anchor="middle">IN CV</text>
  </g>
  <g class="conveyor-connection-out">
    <rect x="270" y="245" width="100" height="48" class="conveyor-lane" />
    <text x="320" y="274" class="conveyor-label" text-anchor="middle">OUT CV</text>
  </g>

  <!-- 5. GR363 작업대 메인 외곽 경계 박스 -->
  <g class="workstation-group">
    <rect x="375" y="40" width="345" height="380" rx="8" class="ws-boundary" />
    <text x="547" y="70" class="ws-title" text-anchor="middle">GR363 WORKSTATION (작업대)</text>
  </g>

  <!-- 6. 포지션 노드 사각형들 (36300 ~ 36306) -->
  <g class="position-nodes">
    <!-- 포지션: 36300 (인입 버퍼) -->
    <g id="WH6-36300" class="tray-position tray-inbound clickable" transform="translate(278, 115)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36300</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">인입 버퍼</text>
    </g>

    <!-- 포지션: 36301 (입고 대기) -->
    <g id="363-36301" class="tray-position tray-inbound clickable" transform="translate(450, 115)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36301</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">입고 대기</text>
    </g>

    <!-- 포지션: 36302 (입고 처리) -->
    <g id="363-36302" class="tray-position clickable" transform="translate(565, 115)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36302</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">입고 처리</text>
    </g>

    <!-- 포지션: 36303 (중앙 작업/피킹) -->
    <g id="363-36303" class="tray-position tray-active clickable" transform="translate(565, 205)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title active-title" text-anchor="middle">36303</text>
      <text x="45" y="42" class="tray-sub active-sub" text-anchor="middle">작업/피킹</text>
    </g>

    <!-- 포지션: 36304 (출고 대기) -->
    <g id="363-36304" class="tray-position tray-outbound clickable" transform="translate(450, 295)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36304</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">출고 대기</text>
    </g>

    <!-- 포지션: 36305 (출고 버퍼) -->
    <g id="363-36305" class="tray-position clickable" transform="translate(565, 295)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36305</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">출고 버퍼</text>
    </g>

    <!-- 포지션: 36306 (배출 포트) -->
    <g id="WH6-36306" class="tray-position tray-outbound clickable" transform="translate(278, 295)">
      <rect width="90" height="55" rx="4" class="tray-rect" />
      <text x="45" y="24" class="tray-title" text-anchor="middle">36306</text>
      <text x="45" y="42" class="tray-sub" text-anchor="middle">배출 포트</text>
    </g>
  </g>

  <!-- 7. [핵심] 연결 흐름 점선 패스 (모든 박스 및 배경보다 위쪽 레이어로 배치) -->
  <g class="flow-path-layer">
    <!-- path 14: 36300 -> 36301 인입 연결선 -->
    <path id="path-14" d="M 368 142.5 L 450 142.5" class="flow-arrow" />
    
    <!-- 내부 순환 연결선 -->
    <path d="M 540 142.5 L 565 142.5" class="flow-arrow" />
    <path d="M 610 170 L 610 205" class="flow-arrow" />
    <path d="M 610 260 L 610 295" class="flow-arrow" />
    <path d="M 565 322.5 L 540 322.5" class="flow-arrow" />

    <!-- path 15: 36304 -> 36306 배출 연결선 -->
    <path id="path-15" d="M 450 322.5 L 368 322.5" class="flow-arrow" />
  </g>

  <!-- 8. 범례 (Legend) -->
  <g class="legend-group" transform="translate(390, 390)">
    <rect x="0" y="0" width="14" height="14" rx="2" class="legend-crane" />
    <text x="20" y="11" class="legend-text">크레인</text>

    <rect x="75" y="0" width="14" height="14" rx="2" class="legend-inbound" />
    <text x="95" y="11" class="legend-text">입고</text>

    <rect x="145" y="0" width="14" height="14" rx="2" class="legend-active" />
    <text x="165" y="11" class="legend-text">작업중</text>

    <rect x="225" y="0" width="14" height="14" rx="2" class="legend-outbound" />
    <text x="245" y="11" class="legend-text">출고</text>
  </g>

  <!-- 9. 최상단 실시간 트레이 렌더링 전용 빈 레이어 그룹 -->
  <g id="tray-layer"></g>
</svg>
